name: build and deploy
on:
  push:
    branches:
      - main
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /tic-tac-toe-game
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: use Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install packages
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Add .nojekyll file
        run: touch ./out/.nojekyll
      - name: Deploy🚀
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: out
